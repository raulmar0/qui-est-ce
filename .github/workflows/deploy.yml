name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Le portail sert aussi ce jeu, sous isadoragazzi.com/quiestce : il le
  # recompile depuis ce dépôt à chaque publication. On le prévient ici. Sans
  # le jeton PORTAIL_TOKEN, l'étape passe son tour et le portail se mettra à
  # jour à sa prochaine publication à lui.
  portail:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      JETON: ${{ secrets.PORTAIL_TOKEN }}
    steps:
      - name: Prévenir le portail
        if: env.JETON != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $JETON" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/raulmar0/isadora/dispatches \
            -d '{"event_type":"jeu-mis-a-jour"}'
